# ITIPS V2.1 — Dahua-native edge node.
#
# Same compose works on a Mac (for validating against real cameras over
# the LAN before Jetson rollout) and on the Jetson at a site.
#
# Networking:
#   - The container reaches your cameras outbound (192.168.x.x) through the
#     normal Docker bridge — works on Mac Docker Desktop without host-mode.
#   - Ports 5050 (dashboard) and 8443 (inbound API) are mapped to the host
#     so you can open http://localhost:5050/dashboard in your Mac browser.
#
# Storage:
#   - ./var/            → /opt/itips/var/            (intake.sqlite, logs, personnel.sqlite)
#   - ./evidence_store/ → /opt/itips/evidence_store/ (signed incident packages)
#   - ./models/         → /opt/itips/models/         (InsightFace / EasyOCR / YOLO / torch caches)
#   The dirs are created on first `up`. Inspect them on the host.
#
# Memory:
#   mem_limit is sized for the ML fallback layer loaded into CPU RAM
#   (Mac dev). On the Jetson, models live in GPU memory so the host
#   side stays lower — but the limit applies to the container's RSS
#   so leave it generous.

services:
  itips:
    build:
      context: .
      dockerfile: Dockerfile
    image: itips/edge:2.1.0
    container_name: itips
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:5050"   # dashboard + Test Console
      - "8443:8443"   # backend → Jetson inbound API
    volumes:
      - ./var:/opt/itips/var
      - ./evidence_store:/opt/itips/evidence_store
      # Persist ML model caches across restarts. First container start
      # downloads ~500 MB of weights (InsightFace buffalo_l, EasyOCR
      # detector + recognizer, YOLOv8n) into this volume; subsequent
      # starts are instant. Named volume (not a host bind mount) so
      # Docker initialises the directory with the container user's
      # uid:gid — a bind mount would clash with the host's owner and
      # leave the dirs unwritable, forcing repeated re-downloads.
      - itips-models:/opt/itips/models
    # tmpfs for transient frame copies — keeps SD/NVMe wear down.
    tmpfs:
      - /tmp:size=128m
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # ─── Jetson GPU access ───────────────────────────────────────────
    # Uncomment on the Jetson so the ML engines actually use CUDA.
    # Requires the NVIDIA Container Toolkit (preinstalled on JetPack)
    # and that the base image and the torch / onnxruntime wheels were
    # swapped to JetPack-matched builds in the Dockerfile.
    #
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Vite/React dashboard — opt-in via the `dev` compose profile ───
  # Mac + lab use:  COMPOSE_PROFILES=dev make up  (or `docker compose --profile dev up`)
  # Jetson prod:    plain `make up` — this service never starts and its
  #                 image is never built, so no frontend bytes ship to
  #                 the edge.
  dashboard:
    profiles: ["dev"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: itips/dashboard:0.1.0
    container_name: itips-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - itips

volumes:
  # Named volume — Docker manages perms so the container user (uid 1000)
  # can write to it. Inspect contents from the host via:
  #   docker run --rm -v itips_itips-models:/m alpine ls /m
  # or wipe with: docker volume rm itips_itips-models
  itips-models:
