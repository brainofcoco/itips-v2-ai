# Production-shaped compose for a Jetson at a tower site.
# `make up` runs this. `make sim` overlays docker-compose.sim.yml on top.

services:
  itips:
    build:
      context: .
      dockerfile: Dockerfile
    image: itips/edge:2.0.0
    container_name: itips
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g  # disable swap for container so kernel never thrashes
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    env_file:
      - .env
    network_mode: host
    volumes:
      - /opt/itips/evidence_store:/opt/itips/evidence_store
      - /opt/itips/dataset:/opt/itips/dataset
      - /opt/itips/var:/opt/itips/var
      - /opt/itips/models:/opt/itips/models
    # /tmp on tmpfs keeps frame copies off the NVMe write counter.
    tmpfs:
      - /tmp:size=512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
