# ITIPS V2.1 — Dahua-native edge node.
#
# This base file builds the lightweight `core` image (no ML, no GPU) and
# runs the same on Mac (validating against real cameras over the LAN) and
# on a Jetson. For GPU-accelerated ML on the Jetson, layer the override:
#   docker compose -f docker-compose.yml -f docker-compose.jetson.yml up -d
# (or `make up-jetson`). For CPU ML validation on a Mac, `make build-ml`.
#
# Ports 5050 (dashboard) and 8443 (inbound API) map to the host.
# Host dirs ./var and ./evidence_store persist intake/logs and signed
# evidence; model caches live in the itips-models named volume.

services:
  itips:
    build:
      context: .
      dockerfile: Dockerfile
      target: core
    image: itips/edge:2.1.0
    container_name: itips
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:5050"
      - "8443:8443"
    volumes:
      - ./var:/opt/itips/var
      - ./evidence_store:/opt/itips/evidence_store
      # Named volume (not a bind mount) so Docker initialises it with the
      # container user's uid:gid — a bind mount clashes with the host owner
      # and leaves the model cache unwritable, forcing re-downloads.
      - itips-models:/opt/itips/models
    tmpfs:
      - /tmp:size=128m
    # Mac default. The Jetson override drops this to fit 8 GB unified RAM.
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Vite/React dashboard — opt-in via the `dev` profile (never starts on
  # the Jetson). Mac/lab: `COMPOSE_PROFILES=dev make up`.
  dashboard:
    profiles: ["dev"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: itips/dashboard:0.1.0
    container_name: itips-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - itips

volumes:
  itips-models:
