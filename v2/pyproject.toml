[project]
name = "itips-ai"
version = "2.1.0"
description = "ITIPS edge node — V2 (Dahua-native)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Seismic Digital & Innovations Limited" }]
dependencies = [
    "flask==3.0.3",
    "werkzeug==3.0.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "pydantic==2.8.2",
    "pyyaml==6.0.2",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    # Incident summary PDF (PRD §4.3 REQ-EV-01) — small pure-Python dep.
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "freezegun==1.5.1",
]
# ML fallback layer (CPU). Optional — the v2 runtime works without these;
# engines raise *EngineUnavailable on first use and degrade to the native
# path. For the Jetson GPU build see Dockerfile.jetson (L4T torch +
# onnxruntime-gpu); torch here is installed CPU-only via the Dockerfile.
ml = [
    "insightface==0.7.3",
    "onnxruntime>=1.16,<2",
    # insightface leaves onnx unpinned; the resolver's pick mismatches the
    # protobuf paddlepaddle caps us at and crashes `import onnx`. Pin both
    # to a coherent, known-good pair.
    "onnx==1.16.1",
    "protobuf==3.20.2",
    # PaddleOCR + PaddlePaddle for the plate-OCR fallback. Pinned to the
    # 2.x line for a stable `ocr()` API; 3.x changes the result shape.
    "paddleocr>=2.10,<3",
    "paddlepaddle>=2.6,<4",
    "ultralytics>=8.2,<9",
    # OpenAI vision validator — lazy-imported, optional kill-switch.
    "openai>=1.40,<2",
]
# AX PRO hub listener — lifts state-transition dedup'd events off the
# Hikvision sensor hub into the SensorDispatcher pipeline.
sensors = [
    "hikaxpro>=2.0",
]

[project.scripts]
itips = "itips.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["itips*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["var", "evidence_store", "models", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
