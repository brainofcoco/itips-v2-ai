[project]
name = "itips-ai"
version = "2.1.0"
description = "ITIPS edge node — V2 (Dahua-native)"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Seismic Digital & Innovations Limited" }]
dependencies = [
    "flask==3.0.3",
    "werkzeug==3.0.3",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "pydantic==2.8.2",
    "pyyaml==6.0.2",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    # Incident summary PDF (PRD §4.3 REQ-EV-01) — small pure-Python dep.
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "freezegun==1.5.1",
]
# Jetson-side ML fallback layer. Optional — the v2 runtime works
# without these; the engines raise *EngineUnavailable on first use
# and the event worker degrades to the native-only path.
#
# Jetson deploy notes:
#   * replace `onnxruntime` with the JetPack-matched `onnxruntime-gpu`
#     wheel (built against L4T) at install time;
#   * `easyocr` pulls `torch` — use the NVIDIA-published torch wheel
#     for the Jetson's JetPack version, not the generic PyPI build.
ml = [
    "insightface==0.7.3",
    "onnxruntime>=1.16,<2",
    # PaddleOCR + PaddlePaddle for the plate-OCR fallback. Pinned to
    # the 2.x line for a stable `ocr()` API; bump to 3.x only when
    # we've validated the new `predict()` shape downstream.
    # Jetson swap: replace `paddlepaddle` with the NVIDIA-published
    # JetPack-matched wheel; `paddleocr` itself is pure Python.
    "paddleocr>=2.10,<3",
    "paddlepaddle>=2.6,<4",
    "ultralytics>=8.2,<9",
    # OpenAI vision validator — lazy-imported, optional kill-switch.
    "openai>=1.40,<2",
]
# AX PRO hub listener — lifts state-transition dedup'd events off the
# Hikvision sensor hub into the SensorDispatcher pipeline.
sensors = [
    "hikaxpro>=2.0",
]

[project.scripts]
itips = "itips.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["itips*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["var", "evidence_store", "models", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
