# Serves the Vite build and reverse-proxies every backend path to the
# `itips` service on the docker-compose network. The dev server's
# vite.config.ts proxy keeps the same path conventions, so paths work
# identically in dev and production.

# Reusable proxy headers — inlined because nginx-alpine doesn't ship
# the proxy_params snippet that Debian's nginx package does.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history routing — unmatched paths fall through to index.html
    # so React Router can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend reverse proxy. `itips` is the compose service name.
    location /api/    { proxy_pass http://itips:5050; }
    location /live/   { proxy_pass http://itips:5050; }
    location /snap/   { proxy_pass http://itips:5050; }
    location /status  { proxy_pass http://itips:5050; }
    location /health  { proxy_pass http://itips:5050; }

    # ML inference can take minutes on CPU (EasyOCR plate read, YOLO,
    # InsightFace warmup), and high-res snapshot uploads from 4K
    # cameras blow past the 1 MB default. Lift both for /api/ml/* so
    # the operator gets a real result instead of an HTML 504/413 page
    # that the dashboard then chokes on with a JSON-parse error.
    location /api/ml/ {
        client_max_body_size 25m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://itips:5050;
    }

    # SSE stream needs no buffering or it'll batch updates and feel laggy.
    location /events {
        proxy_pass http://itips:5050;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
    location /api/alerts/stream {
        proxy_pass http://itips:5050;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}
