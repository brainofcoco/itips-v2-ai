openapi: 3.1.0
info:
  title: ITIPS V2 — Jetson Edge API (Dahua-native)
  version: 2.1.0
  description: |
    Two HTTP surfaces run on every Jetson:

    * **Public 5050** — operator dashboard, MJPEG feeds, SSE alert stream,
      worker-enrollment / plate-list management, Test Console.
    * **Inbound 8443** — backend → Jetson commands (B1–B5). Bearer auth.

    All AI runs on the Dahua cameras. The Jetson subscribes to camera
    events, packages signed evidence, and proxies operator clicks onto
    `faceRecognitionServer.cgi`, `recordUpdater.cgi`, `coaxialControlIO.cgi`,
    and `ptz.cgi`.
servers:
  - url: http://localhost:5050
    description: Public surface
  - url: http://localhost:8443
    description: Inbound surface (bearer token required)
tags:
  - name: Health
  - name: Cameras
  - name: Workers
    description: Face allowlist mapped into each camera's FaceRecognitionServer.
  - name: Plates
    description: Per-camera TrafficRedList / TrafficBlackList management.
  - name: Deterrence
  - name: Snapshots
  - name: Incidents
  - name: Alerts
  - name: TestConsole
    description: Live event tap, PTZ jog, synthetic event injection, inbound proxy.
  - name: Inbound
    description: Backend → Jetson commands (B1–B5). Bearer auth.
  - name: Capabilities
    description: |
      Per-camera capability matrix (probed from each Dahua camera) plus
      operator overrides for forcing the Jetson fallback path instead
      of trusting the camera's native feature.
  - name: Zones
    description: |
      Polygon zone CRUD for the behavioral fallback. Region zones drive
      `intrusion` + `loitering`; line zones drive `line_crossing`.
      Coordinates are normalised `[0,1]` in image space so they survive
      resolution changes.
  - name: Sensors
    description: |
      AX PRO sensor pipeline. Operator binds each hub zone to a
      `(camera, preset)` pair; on alarm the dispatcher pans, snapshots,
      and runs face recognition. The Simulate endpoint drives the
      exact same pipeline as a real hub event — use it to test without
      an AX PRO hub on the network.
  - name: ML
    description: |
      Jetson-side fallback engines (face, plate, behavior). The status,
      warmup, and direct-invoke routes back the dashboard's ML Lab tab.
      Pass `?dispatch=1` on recognize/read/analyse to also fire the
      result through the AlertEngine — Alerts tab lights up in real time.
  - name: Activity
    description: |
      Real-time detection feed (Live page) and ThreatEvaluator verdict
      history with the captured stills/clips (Investigations page).
  - name: Webhooks
    description: |
      Outbound push delivery. Subscribers register a URL + secret + event
      filter and receive HMAC-signed POSTs as alerts / verdicts / sensor
      events happen, instead of polling. Payload schema in docs/WEBHOOKS.md.
security: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /status:
    get:
      tags: [Health]
      summary: Site identity + active camera list
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /api/cameras:
    get:
      tags: [Cameras]
      summary: List Dahua cameras the Jetson talks to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cameras:
                    type: array
                    items: { $ref: "#/components/schemas/CameraSummary" }

  /video_feed/{camera_id}:
    get:
      tags: [Snapshots]
      summary: MJPEG feed of the latest annotated snapshot
      description: |
        The Jetson no longer decodes RTSP continuously. The feed shows the
        most-recent snapshot fetched in response to a camera event (Dahua
        `/cgi-bin/snapshot.cgi`).
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: multipart/x-mixed-replace MJPEG stream
          content:
            multipart/x-mixed-replace: {}

  /api/snapshot/{camera_id}:
    get:
      tags: [Snapshots]
      summary: One-shot JPEG (from frame bus, falling back to the camera)
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg: {}
        "404": { description: unknown camera or no frame available }
        "503": { description: camera unreachable }

  /api/alerts/stream:
    get:
      tags: [Alerts]
      summary: SSE feed of every record the AlertEngine emits
      responses:
        "200":
          description: SSE
          content:
            text/event-stream: {}

  /api/alerts/latest:
    get:
      tags: [Alerts]
      summary: Snapshot of the in-memory alert history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: true }

  /api/workers:
    get:
      tags: [Workers]
      summary: List enrolled workers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerList" }
    post:
      tags: [Workers]
      summary: Enroll a worker into the local face engine
      description: |
        Computes an InsightFace embedding from the JPEG and stores it keyed by
        `person_id`. Recognition runs entirely on this embedding store — the
        cameras' onboard face DB is not used.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [full_name, image]
              properties:
                full_name: { type: string }
                person_id: { type: string, description: "Optional. Auto-generated if omitted." }
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerEnrollResult" }
        "422": { description: no detectable face in the image }
        "503": { description: face engine unavailable }

  /api/workers/{person_id}:
    delete:
      tags: [Workers]
      summary: Remove a worker's enrolled embedding
      parameters:
        - { name: person_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404": { description: unknown person_id }

  /api/plates:
    get:
      tags: [Plates]
      summary: List the plates in a camera-side list
      parameters:
        - { name: list_type, in: query, required: false,
            schema: { type: string, enum: [TrafficRedList, TrafficBlackList], default: TrafficRedList } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  list_type: { type: string }
                  cameras:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: "#/components/schemas/PlateRecord" }
    post:
      tags: [Plates]
      summary: Add a plate to one or more cameras
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlateAdd" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/plates/{camera_id}/{rec_no}:
    delete:
      tags: [Plates]
      summary: Remove a plate from one camera by its rec_no
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: rec_no,    in: path, required: true, schema: { type: integer } }
        - { name: list_type, in: query, required: false,
            schema: { type: string, enum: [TrafficRedList, TrafficBlackList], default: TrafficRedList } }
      responses:
        "200": { description: OK }
        "404": { description: unknown camera }

  /api/deterrence/{camera_id}/fire:
    post:
      tags: [Deterrence]
      summary: Engage the TiOC strobe and/or speaker
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                light: { type: boolean, default: true }
                speaker: { type: boolean, default: true }
      responses:
        "200": { description: OK }
        "404": { description: unknown camera }
        "502": { description: camera rejected the command (often non-TiOC model) }

  /api/deterrence/{camera_id}/standdown:
    post:
      tags: [Deterrence]
      summary: Silence the strobe + speaker and hand control back to camera AI
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /api/incidents:
    get:
      tags: [Incidents]
      summary: List signed evidence packages on local disk
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items: { $ref: "#/components/schemas/IncidentSummary" }

  /api/incidents/{incident_id}:
    get:
      tags: [Incidents]
      summary: Detailed view — storage path, metadata, manifest, signature, captures
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentDetail" }
        "404": { description: incident not found }
    delete:
      tags: [Incidents]
      summary: Permanently delete an incident package from disk (irreversible)
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  incident_id: { type: string }
        "404": { description: incident not found }
        "500": { description: delete failed }

  /api/incidents/{incident_id}/files/{filename}:
    get:
      tags: [Incidents]
      summary: Download a single file out of an incident package
      description: |
        `filename` is a package-relative path from IncidentDetail.files or a
        *_captures[].filename (e.g. face_captures/0.jpg). `?inline=1` serves
        inline (thumbnail / PDF / video preview) instead of as an attachment.
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
        - { name: inline, in: query, required: false,
            schema: { type: string, enum: ["1", "true"] } }
      responses:
        "200":
          description: The file (image / video / PDF / JSON, by extension)
          content:
            application/octet-stream: {}
        "404": { description: incident or file not found }

  /api/test/events/recent:
    get:
      tags: [TestConsole]
      summary: Last N raw events received from every camera
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RawEvent" }

  /api/test/events/stream:
    get:
      tags: [TestConsole]
      summary: SSE feed of every raw event (no cooldown filtering)
      responses:
        "200":
          description: SSE
          content:
            text/event-stream: {}

  /api/test/ptz/{camera_id}/{direction}:
    post:
      tags: [Cameras, TestConsole]
      summary: Jog the camera PTZ (pan/tilt/zoom/focus) — aim it before saving a preset
      description: |
        Manual PTZ control. Send `action: start` to begin moving in
        `direction`, then `action: stop` to halt — model it as a
        press-and-hold button (start on mousedown, stop on mouseup).
        `speed` is 1–8. `direction` covers the 4 pans, 4 diagonals, zoom
        (`zoom_wide`/`zoom_tele`) and focus (`focus_near`/`focus_far`).

        Set-a-preset flow:
          1. Jog with up/down/left/right (+ diagonals) and zoom to aim.
          2. `POST /api/cameras/{camera_id}/presets` — save the current
             position as a named preset.
          3. `POST /api/cameras/{camera_id}/presets/{index}/goto` — recall it.

        A manual jog clears the camera's tracked preset for ~5 min, so
        preset-gated zones don't fire on the unknown view while you drive.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - name: direction
          in: path
          required: true
          schema:
            type: string
            enum: [up, down, left, right, left_up, right_up, left_down, right_down,
                   zoom_wide, zoom_tele, focus_near, focus_far]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start, stop], default: start }
                speed: { type: integer, minimum: 1, maximum: 8, default: 4 }
      responses:
        "200": { description: OK }
        "400": { description: invalid direction }
        "404": { description: unknown camera }
        "502": { description: "camera rejected the command — carries a hint (wrong PTZ channel / ONVIF perms / unsupported code)" }
        "400": { description: unknown direction }

  /api/test/simulate/{event_type}:
    post:
      tags: [TestConsole]
      summary: Inject a synthetic event into the AlertEngine
      parameters:
        - name: event_type
          in: path
          required: true
          schema:
            type: string
            enum: [face_intruder, face_known, line_crossing, intrusion,
                   loitering, plate, fire, smoke]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                camera_id: { type: integer, default: 1 }
                plate_number: { type: string }
                similarity: { type: integer }
                bbox:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items: { type: number }
      responses:
        "200": { description: OK }

  /api/test/inbound/{endpoint}:
    post:
      tags: [TestConsole]
      summary: Proxy to the inbound (8443) API with the configured bearer
      parameters:
        - name: endpoint
          in: path
          required: true
          schema:
            type: string
            enum: ["personnel/sync", "config", "maintenance/window", "commands", "firmware/update"]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: relayed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: integer }
                  response: { description: body returned by the inbound API }

  /local/api/v1/personnel/sync:
    post:
      tags: [Inbound]
      summary: B1 — sync a worker face into the local face engine
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/B1Payload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/B1Result" }

  /local/api/v1/config:
    post:
      tags: [Inbound]
      summary: B2 — hot config push (acknowledged, no-op at Jetson level)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  version: { type: string }

  /local/api/v1/maintenance/window:
    post:
      tags: [Inbound]
      summary: B3 — arm/disarm a maintenance window
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/B3Payload" }
      responses:
        "200": { description: OK }

  /local/api/v1/commands:
    post:
      tags: [Inbound]
      summary: B4 — PTZ override, deterrence fire/standdown, stream request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/B4Payload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  command_accepted: { type: boolean }
                  reason: { type: string }

  /local/api/v1/firmware/update:
    post:
      tags: [Inbound]
      summary: B5 — schedule firmware install
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: OK

  # ─── Capabilities + Health probes ────────────────────────────────

  /api/health/cameras:
    get:
      tags: [Capabilities]
      summary: Run the per-camera Dahua capability probe
      description: |
        Hits each camera with a small battery of HTTP checks (reachable,
        snapshot, MJPEG, face DB, ANPR list, PTZ, deterrence, IVS rules,
        face-group binding, ANPR event subscription, white-light, alarm-out,
        SD storage) plus passive observation of which event codes the
        camera has actually fired since boot. Cached for 20s; pass
        `?force=1` to bypass the cache.
      parameters:
        - { name: force, in: query, required: false, schema: { type: string, enum: ["1", "true"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthProbeReport" }

  /api/health/capabilities:
    get:
      tags: [Capabilities]
      summary: Per-camera capability decisions + engine readiness
      description: |
        Distills the raw probe matrix into yes/no answers the event
        worker actually uses — for each camera, is `face_recognition`,
        `anpr`, `ivs_rules`, `deterrence`, `snapshot`, `local_storage`
        currently being served natively or via the Jetson fallback?
        The `overrides` field surfaces any operator-pinned decisions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilitySummary" }

  /api/health/capabilities/{camera_id}/{capability}/override:
    post:
      tags: [Capabilities]
      summary: Force the fallback (or pin to native) for one capability
      description: |
        Operator override that beats the probe result. Set
        `force_fallback=true` to make the event worker route this
        camera's capability through the Jetson fallback even when the
        camera reports native support — useful when a camera's onboard
        face DB is empty or unreliable. Set `false` to pin to native.
        Set `null` to clear and revert to following the probe.
        Persisted to `/opt/itips/var/ml_overrides.json`.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: capability, in: path, required: true,
            schema: { type: string, enum: [face_recognition, anpr, ivs_rules,
                       deterrence, snapshot, local_storage] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [force_fallback]
              properties:
                force_fallback:
                  oneOf: [{ type: boolean }, { type: "null" }]
      responses:
        "200": { description: Override applied }
        "400": { description: Invalid capability or body }

  /api/cameras/{camera_id}/presets:
    get:
      tags: [Cameras]
      summary: List the camera's onboard PTZ presets
      description: |
        Drives the preset dropdown in the Sensors tab — operator picks
        a preset by name when binding a sensor zone to a camera.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  camera_id: { type: integer }
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/PresetInfo" }
        "404": { description: Unknown camera }
    post:
      tags: [Cameras]
      summary: Save the camera's current PTZ position as a named preset
      description: |
        `index` omitted picks the next free slot [1..255]; `name` omitted
        uses `preset_<index>`. Some firmware refuses naming over HTTP — the
        response then carries `name_warning` and keeps the camera auto-name.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                index: { type: integer }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  camera_id: { type: integer }
                  preset: { $ref: "#/components/schemas/PresetInfo" }
                  name_warning: { type: string }
        "400": { description: index not an int }
        "404": { description: Unknown camera }
        "502": { description: camera rejected the save }

  # ─── Zones (behavioral fallback) ─────────────────────────────────

  /api/zones/{camera_id}:
    get:
      tags: [Zones]
      summary: List polygon zones for a camera
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  camera_id: { type: integer }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/Zone" }
    post:
      tags: [Zones]
      summary: Upsert a polygon zone for the camera
      description: |
        Coordinates are normalised `[0,1]` in image space. Region zones
        need ≥3 points; line zones need ≥2. `zone_id` is the upsert key.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Zone" }
      responses:
        "200": { description: Zone saved }
        "400": { description: Validation failed }

  /api/zones/{camera_id}/{zone_id}:
    delete:
      tags: [Zones]
      summary: Delete a polygon zone
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: zone_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Deleted }
        "404": { description: Zone not found }

  # ─── Sensors ─────────────────────────────────────────────────────

  /api/sensors/listener/status:
    get:
      tags: [Sensors]
      summary: AX PRO hub listener health
      description: |
        Drives the topbar pill and the Sensors tab's hub indicator.
        When `wired=false`, `ITIPS_AXPRO_HOST` is unset and only the
        Simulate endpoint can drive the dispatcher. When `wired=true`,
        `connected` reflects the live hub session; `armed` reflects
        the cached `subsystem_status()` reading; `last_error` carries
        the most recent connection/poll exception (cleared on success).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListenerStatus" }

  /api/sensors/map:
    get:
      tags: [Sensors]
      summary: List zone → camera+preset bindings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  mappings:
                    type: array
                    items: { $ref: "#/components/schemas/SensorMapping" }
    post:
      tags: [Sensors]
      summary: Upsert a sensor → camera+preset binding
      description: |
        Persisted to `/opt/itips/var/sensor_map.json`. `zone_id` is
        the upsert key. `preset_name` must match a preset defined on
        the camera (use `/api/cameras/{id}/presets` to enumerate).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorMapping" }
      responses:
        "200": { description: Mapping saved }
        "400": { description: Validation failed }

  /api/sensors/map/{zone_id}:
    delete:
      tags: [Sensors]
      summary: Remove a sensor binding
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "404": { description: Zone not in map }

  /api/sensors/simulate/{zone_id}:
    post:
      tags: [Sensors]
      summary: Inject a synthetic sensor event
      description: |
        Queues a `SensorEvent` with `source=simulate` straight into the
        dispatcher — exactly the same pipeline a real AX PRO event
        would trigger (pan PTZ → snapshot → face validate → alert).
        Use this to test without a hub on the network.
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type: { type: string, default: doorContact,
                              description: "PIR | doorContact | vibration | pircam | smoke" }
                event_state: { type: string, default: alarm }
                zone_name: { type: string }
      responses:
        "200":
          description: Event queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  queued: { type: boolean }
                  event: { $ref: "#/components/schemas/SensorEvent" }
        "503": { description: Dispatcher not wired or queue full }

  /api/sensors/events/recent:
    get:
      tags: [Sensors]
      summary: Recent sensor events + dispatcher verdicts (ring buffer)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/SensorEventRecord" }
    delete:
      tags: [Sensors]
      summary: Clear the recent-events ring buffer
      responses:
        "200": { description: Cleared }

  # ─── ML Lab — direct engine invocation ───────────────────────────

  /api/ml/status:
    get:
      tags: [ML]
      summary: Per-engine wired / ready state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  face:     { $ref: "#/components/schemas/MLEngineStatus" }
                  plate:    { $ref: "#/components/schemas/MLEngineStatus" }
                  behavior: { $ref: "#/components/schemas/MLEngineStatus" }

  /api/ml/warmup:
    post:
      tags: [ML]
      summary: Trigger `warmup_async()` on every wired engine
      description: |
        Engines lazy-load on first use; this kicks each one's warmup
        thread so the first real event doesn't pay the 3–5s cold-start
        tax. Idempotent.
      responses:
        "200":
          description: OK (returns same shape as `/api/ml/status`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  face:     { $ref: "#/components/schemas/MLEngineStatus" }
                  plate:    { $ref: "#/components/schemas/MLEngineStatus" }
                  behavior: { $ref: "#/components/schemas/MLEngineStatus" }

  /api/ml/face/enrolled:
    get:
      tags: [ML]
      summary: List people enrolled in the Jetson face DB
      description: |
        Mirror of the EmbeddingStore — populated by `POST /api/workers`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  count: { type: integer }
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        person_id: { type: string }
                        full_name: { type: string }
                        dim: { type: integer, description: "embedding dimension (512 for ArcFace)" }

  /api/ml/face/recognize:
    post:
      tags: [ML]
      summary: Run InsightFace against an uploaded image
      description: |
        Pass an image as multipart `image=`. With `?dispatch=1`, the
        result is also routed through the AlertEngine — match fires
        `personnel_seen`, no match fires `face_intruder`. Multipart
        `camera_id` is the cam attributed in the dispatched alert.
      parameters:
        - { name: dispatch, in: query, required: false,
            schema: { type: string, enum: ["1", "true"] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                camera_id: { type: string, description: "for the dispatch path" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaceRecognizeResult" }
        "503": { description: Face engine not wired }

  /api/ml/plate/read:
    post:
      tags: [ML]
      summary: Run PaddleOCR + plate-pattern filter against an uploaded image
      description: |
        Pass an image as multipart `image=`. With `?dispatch=1` the
        read also fires `handle_plate_capture`. The filter requires
        5–10 alphanum chars with at least 2 letters AND 2 digits.
        Confidence floor defaults to 0.4.
      parameters:
        - { name: dispatch, in: query, required: false,
            schema: { type: string, enum: ["1", "true"] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                camera_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlateReadResult" }
        "503": { description: Plate engine not wired }

  /api/ml/behavior/{camera_id}/analyse:
    post:
      tags: [ML]
      summary: Run YOLOv8 + IoU tracker + zone evaluation
      description: |
        Pass an image as multipart `image=`. Response includes both
        synthesised alerts AND raw YOLO detections + the camera's
        zones — so when no alert fires you can see whether YOLO
        missed the person, the person was outside every zone, or
        the wrong camera_id was selected. With `?dispatch=1`, each
        alert is also routed through `handle_behaviour_alert_simple`.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: dispatch, in: query, required: false,
            schema: { type: string, enum: ["1", "true"] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorAnalysisResult" }
        "503": { description: Behavior engine not wired }

  # ─── Live (MJPEG alias used by the dashboard <img> tag) ──────────
  /live/{camera_id}:
    get:
      tags: [Snapshots]
      summary: MJPEG feed (alias of /video_feed/{camera_id})
      description: |
        Identical annotated MJPEG stream as `/video_feed/{camera_id}`; the
        dashboard binds `<img src="/live/{id}">`. Browsers cannot render the
        camera RTSP directly, so plug a frontend into this HTTP feed.
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: multipart/x-mixed-replace MJPEG stream
          content:
            multipart/x-mixed-replace: {}

  # ─── Activity feed + Investigations verdicts ─────────────────────
  /api/activity/recent:
    get:
      tags: [Activity]
      summary: Real-time detection feed for the Live page
      parameters:
        - { name: limit, in: query, required: false,
            schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  events:
                    type: array
                    items: { type: object, additionalProperties: true }

  /api/verdicts/recent:
    get:
      tags: [Activity]
      summary: ThreatEvaluator verdict history (Investigations page)
      parameters:
        - { name: limit, in: query, required: false,
            schema: { type: integer, default: 100, maximum: 300 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  verdicts:
                    type: array
                    items: { type: object, additionalProperties: true }

  /api/verdicts:
    delete:
      tags: [Activity]
      summary: Wipe Investigations history (DB rows + captured JPEGs)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  capture_dirs_removed: { type: integer }
        "503": { description: verdict tap not wired }

  /api/verdicts/captures/{capture_id}:
    get:
      tags: [Activity]
      summary: List the stills + MP4 clip captured for one verdict
      parameters:
        - { name: capture_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  capture_id: { type: string }
                  images: { type: array, items: { type: string } }
                  videos: { type: array, items: { type: string } }

  /api/verdicts/captures/{capture_id}/{filename}:
    get:
      tags: [Activity]
      summary: Fetch one capture file (JPEG still or MP4 clip)
      parameters:
        - { name: capture_id, in: path, required: true, schema: { type: string } }
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: image/jpeg or video/mp4
          content:
            image/jpeg: {}
            video/mp4: {}
        "404": { description: not found }

  # ─── Incidents (verify / bulk-delete / synthetic test package) ───
  /api/incidents/{incident_id}/verify:
    post:
      tags: [Incidents]
      summary: Re-verify a signed package (per-file SHA-256 + manifest hash)
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  manifest_hash_signed: { type: string, nullable: true }
                  manifest_hash_actual: { type: string }
                  manifest_hash_ok: { type: boolean }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        filename: { type: string }
                        status: { type: string, enum: [ok, mismatch, missing] }
                        expected: { type: string, nullable: true }
                        actual: { type: string, nullable: true }
        "400": { description: manifest missing }
        "404": { description: incident not found }

  /api/incidents/bulk-delete:
    post:
      tags: [Incidents]
      summary: Delete many incidents in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
                all: { type: boolean, description: "delete every package on disk" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  requested: { type: integer }
                  deleted: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        incident_id: { type: string }
                        status: { type: string, enum: [ok, not_found, error] }
                        error: { type: string }
        "400": { description: "neither ids[] nor all=true provided" }

  /api/evidence/test/run:
    post:
      tags: [Incidents]
      summary: Build a complete synthetic evidence package end-to-end
      description: |
        Real packager, signature and PDF — only the JPEG/event payloads are
        synthetic. Returns the package dir + signature so the operator can
        inspect it straight away in the Incidents tab.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  incident_id: { type: string }
                  package_dir: { type: string }
                  signature: { type: string, nullable: true }
                  manifest_hash: { type: string, nullable: true }
        "502": { description: finalize failed }
        "503": { description: no packager wired }

  # ─── Presets (current position, base/auto-restore, goto, delete) ─
  /api/presets/current:
    get:
      tags: [Cameras]
      summary: Current preset each camera is parked at
      description: |
        Drives zone-overlay filtering on the Live page. A `null` value for a
        camera means no goto has been commanded since boot (or a manual jog
        cleared it) — the UI then hides preset-bound zones for that camera.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  cameras:
                    type: object
                    additionalProperties: { type: string, nullable: true }

  /api/cameras/{camera_id}/base-preset:
    get:
      tags: [Cameras]
      summary: Get the auto-restore preset (panned to when RTSP recovers)
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  camera_id: { type: integer }
                  base_preset_name: { type: string, nullable: true }
    put:
      tags: [Cameras]
      summary: Set or clear the auto-restore preset
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                  description: preset name; null or empty clears the binding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  camera_id: { type: integer }
                  base_preset_name: { type: string, nullable: true }
        "503": { description: camera settings not wired }

  /api/cameras/{camera_id}/presets/{index}:
    delete:
      tags: [Cameras]
      summary: Delete an onboard PTZ preset by index
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "404": { description: Unknown camera }
        "502": { description: camera rejected the delete }

  /api/cameras/{camera_id}/presets/{index}/goto:
    post:
      tags: [Cameras]
      summary: Jump the PTZ to a preset by index
      parameters:
        - { name: camera_id, in: path, required: true, schema: { type: integer } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  preset_name: { type: string, nullable: true }
        "404": { description: Unknown camera }
        "502": { description: camera rejected the goto }

  # ─── ML: OpenAI vision validator ─────────────────────────────────
  /api/ml/openai/status:
    get:
      tags: [ML]
      summary: OpenAI validator wiring, model, scenarios, hourly token usage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wired: { type: boolean }
                  enabled: { type: boolean }
                  configured: { type: boolean }
                  model: { type: string }
                  scenarios: { type: array, items: { type: string } }
                  tokens_used_hour: { type: integer }
                  tokens_cap_hour: { type: integer }
                  recent:
                    type: array
                    items: { type: object, additionalProperties: true }

  /api/ml/openai/validate/{scenario}:
    post:
      tags: [ML]
      summary: Direct OpenAI vision probe (bypasses confidence/cooldown gating)
      description: |
        Multipart `image=` plus any scenario context fields as form keys.
        Token quota still applies. Scenario must be one listed by
        `/api/ml/openai/status`.
      parameters:
        - { name: scenario, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
              additionalProperties: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  scenario: { type: string }
                  verdict: { type: string }
                  category: { type: string }
                  confidence: { type: number }
                  summary: { type: string }
                  model: { type: string }
                  tokens_used: { type: integer }
                  should_suppress: { type: boolean }
                  should_escalate: { type: boolean }
        "400": { description: unknown scenario or no image }
        "502": { description: validator error or quota exhausted }
        "503": { description: validator not enabled }

  # ─── Sensors: AX PRO hub admin + siren (all 503 if hub not wired) ─
  /api/sensors/hub/state:
    get:
      tags: [Sensors]
      summary: Subsystem + zone snapshot (arming mode, bypass, silent flags)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  subsystems: { type: array, items: { type: object, additionalProperties: true } }
                  zones: { type: array, items: { type: object, additionalProperties: true } }
        "502": { description: hub query failed }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/disarm:
    post:
      tags: [Sensors]
      summary: Disarm one or more subsystems
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_ids: { type: array, items: { type: integer }, default: [1, 2, 3] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  results: { type: array, items: { type: object, additionalProperties: true } }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/arm-away:
    post:
      tags: [Sensors]
      summary: Arm subsystems Away (disarms first, optional bypass clear)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_ids: { type: array, items: { type: integer }, default: [1, 2, 3] }
                clear_bypass: { type: array, items: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  disarm: { type: array, items: { type: object, additionalProperties: true } }
                  bypass_recover: { type: array, items: { type: object, additionalProperties: true } }
                  arm_away: { type: array, items: { type: object, additionalProperties: true } }
        "503": { description: AX PRO admin not wired }

  /api/sensors/zones/{zone_id}/bypass:
    post:
      tags: [Sensors]
      summary: Bypass a hub zone
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "502": { description: hub rejected (e.g. armedStatus) }
        "503": { description: AX PRO admin not wired }

  /api/sensors/zones/{zone_id}/unbypass:
    post:
      tags: [Sensors]
      summary: Clear an operational bypass on a hub zone
      description: |
        May 502 with `armedStatus` if the parent subsystem is armed — fall
        back to `/api/sensors/hub/arm-away` with `clear_bypass=[zone_id]`.
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "502": { description: hub rejected (e.g. armedStatus) }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/siren/status:
    get:
      tags: [Sensors]
      summary: Per-siren status (online, signal, battery, tamper)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, sirens: { type: array, items: { type: object, additionalProperties: true } } } }
        "502": { description: hub query failed }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/siren/start:
    post:
      tags: [Sensors]
      summary: Sound the siren (WARNING — real 100+ dB if paired)
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { sub_id: { type: integer, default: 1 } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "502": { description: hub rejected }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/siren/stop:
    post:
      tags: [Sensors]
      summary: Silence the siren
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { sub_id: { type: integer, default: 1 } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "502": { description: hub rejected }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/siren/test:
    post:
      tags: [Sensors]
      summary: Self-clearing siren burst (start, wait, stop)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_id: { type: integer, default: 1 }
                duration_s: { type: number, default: 2.0, maximum: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "502": { description: hub rejected }
        "503": { description: AX PRO admin not wired }

  # ─── Webhooks (outbound push subscriptions) ──────────────────────
  /api/webhooks/event-kinds:
    get:
      tags: [Webhooks]
      summary: List the event kinds a subscriber can filter on
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }

  /api/webhooks/subscribers:
    get:
      tags: [Webhooks]
      summary: List subscribers (secrets omitted)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  subscribers: { type: array, items: { $ref: "#/components/schemas/WebhookSubscriber" } }
        "503": { description: webhooks not wired }
    post:
      tags: [Webhooks]
      summary: Create a subscriber (secret returned ONCE in this response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "must start with http:// or https://" }
                event_filter: { type: array, items: { type: string }, default: ["*"] }
                description: { type: string }
                enabled: { type: boolean, default: true }
                secret: { type: string, description: "auto-generated if omitted" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  subscriber:
                    allOf:
                      - { $ref: "#/components/schemas/WebhookSubscriber" }
                      - type: object
                        properties: { secret: { type: string } }
        "400": { description: bad url or unknown event kind }
        "503": { description: webhooks not wired }

  /api/webhooks/subscribers/{sub_id}:
    get:
      tags: [Webhooks]
      summary: Get one subscriber (secret omitted)
      parameters:
        - { name: sub_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, subscriber: { $ref: "#/components/schemas/WebhookSubscriber" } } }
        "404": { description: not found }
        "503": { description: webhooks not wired }
    patch:
      tags: [Webhooks]
      summary: Update url / event_filter / description / enabled / secret
      parameters:
        - { name: sub_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                event_filter: { type: array, items: { type: string } }
                description: { type: string }
                enabled: { type: boolean }
                secret: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, subscriber: { $ref: "#/components/schemas/WebhookSubscriber" } } }
        "400": { description: bad url or unknown event kind }
        "404": { description: not found }
        "503": { description: webhooks not wired }
    delete:
      tags: [Webhooks]
      summary: Delete a subscriber
      parameters:
        - { name: sub_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, removed: { type: boolean } } }
        "503": { description: webhooks not wired }

  /api/webhooks/subscribers/{sub_id}/test:
    post:
      tags: [Webhooks]
      summary: Queue a synthetic test delivery to one subscriber
      parameters:
        - { name: sub_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, queued: { type: integer } } }
        "404": { description: subscriber not found or disabled }
        "503": { description: dispatcher not running }

  /api/webhooks/subscribers/{sub_id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret (new secret returned ONCE)
      parameters:
        - { name: sub_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  subscriber:
                    allOf:
                      - { $ref: "#/components/schemas/WebhookSubscriber" }
                      - type: object
                        properties: { secret: { type: string } }
        "404": { description: not found }
        "503": { description: webhooks not wired }

  /api/webhooks/deliveries:
    get:
      tags: [Webhooks]
      summary: Recent delivery attempts (optionally filtered by subscriber)
      parameters:
        - { name: subscriber_id, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deliveries: { type: array, items: { type: object, additionalProperties: true } }
        "503": { description: webhooks not wired }

  # ─── Sensors: AX PRO calibration wizard + zone admin ─────────────
  /api/sensors/listener/zones:
    get:
      tags: [Sensors]
      summary: Diagnostic dump — raw hub zone payload + cached edge state
      description: |
        Use when a real sensor activates but nothing reaches the events
        feed: compare `raw.ZoneList[...]` against `edge_state` to see if the
        field name the listener reads matches this firmware's output.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wired: { type: boolean }
                  connected: { type: boolean }
                  edge_state: { type: object, additionalProperties: true }
                  raw: { type: object, additionalProperties: true }

  /api/sensors/zones/{zone_id}/config:
    get:
      tags: [Sensors]
      summary: Read a hub zone's configuration
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, config: { type: object, additionalProperties: true } } }
        "502": { description: hub query failed }
        "503": { description: AX PRO admin not wired }
    patch:
      tags: [Sensors]
      summary: Set a single zone-config key (e.g. armNoBypassEnabled)
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string, example: armNoBypassEnabled }
                value: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, payload: { type: object, additionalProperties: true } } }
        "400": { description: missing key or value }
        "502": { description: hub rejected (e.g. armed) }
        "503": { description: AX PRO admin not wired }

  /api/sensors/zones/{zone_id}/silent:
    post:
      tags: [Sensors]
      summary: Toggle a zone 'silent' (hub reports alarm but doesn't sound its siren)
      description: |
        ITIPS sounds the siren after evaluation instead. The silent flag
        persists once set. Rejected with a `hint` if the subsystem is armed.
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { silent: { type: boolean, default: true } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  zone_id: { type: integer }
                  silent: { type: boolean }
                  payload: { type: object, additionalProperties: true }
        "502": { description: hub rejected (carries an actionable hint if armed) }
        "503": { description: AX PRO admin not wired }

  /api/sensors/hub/silence-mapped:
    post:
      tags: [Sensors]
      summary: Set silent on every zone that has a sensor→camera binding
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { silent: { type: boolean, default: true } } }
      responses:
        "200":
          description: OK (per-zone results so partial failures are visible)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  silent: { type: boolean }
                  hint: { type: string, nullable: true }
                  updated: { type: integer }
                  total: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        zone_id: { type: integer }
                        status: { type: string, enum: [ok, error] }
                        error: { type: string }
        "503": { description: AX PRO admin or sensor map not wired }

  /api/sensors/zones/{zone_id}/calibrate:
    post:
      tags: [Sensors]
      summary: Atomic save-preset + bind-sensor (calibration wizard)
      description: |
        Saves the camera's current PTZ position as a named preset AND binds
        the hub zone to `(camera, preset)` in one action — the install step
        operators most often forget to do in two.
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [camera_id]
              properties:
                camera_id: { type: integer }
                name: { type: string, description: "preset name; defaults to zone_<id>" }
                sensor_type: { type: string, example: doorContact }
                description: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mapping: { type: object, additionalProperties: true }
                  preset: { $ref: "#/components/schemas/PresetInfo" }
        "400": { description: camera_id missing or invalid mapping }
        "404": { description: unknown camera }
        "502": { description: saving preset failed }
        "503": { description: sensor map not wired }

  /api/sensors/zones/{zone_id}/test-pan:
    post:
      tags: [Sensors]
      summary: Pan the bound camera home then to its preset; return a snapshot URL
      description: |
        Verifies a sensor binding by making the motion visible (away, then
        back to the bound preset) and handing back a cache-busted snapshot URL.
      parameters:
        - { name: zone_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mapping: { type: object, additionalProperties: true }
                  snapshot_url: { type: string }
        "404": { description: zone has no binding }
        "502": { description: camera not connected or goto failed }
        "503": { description: sensor map not wired }

  # ─── Activity feed: real-time SSE push ───────────────────────────
  /api/activity/stream:
    get:
      tags: [Activity]
      summary: SSE push of the raw detection feed (real-time, no polling)
      description: |
        Server-sent events. Each `data:` line is one detection entry — the
        same shape as `/api/activity/recent` items (`seq`, `camera_id`,
        `kind` = line_crossing | intrusion | loitering | sensor, `label`,
        `zone_id`, `zone_name`, `detail`, `status`, `source`, `ts`). The
        buffer is replayed once on connect, then new entries stream as they
        happen. Subscribe with `new EventSource("/api/activity/stream")`.
        The same detections are also pushed to webhook subscribers as
        `activity.detection`.
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream: {}
        "503": { description: activity tap not wired }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Status:
      type: object
      properties:
        version: { type: string }
        mode: { type: string }
        site_id: { type: string, nullable: true }
        operator_id: { type: string, nullable: true }
        device_id: { type: string, nullable: true }
        active_cameras:
          type: array
          items: { type: integer }
        frame_bus_cameras:
          type: array
          items: { type: integer }

    CameraSummary:
      type: object
      properties:
        camera_id: { type: integer }
        endpoint: { type: string }
        workers_group_id: { type: string, nullable: true }
        ptz_connected: { type: boolean }

    WorkerList:
      type: object
      properties:
        workers:
          type: array
          items:
            type: object
            properties:
              person_id: { type: string }
              full_name: { type: string }
              jetson_enrolled:
                type: boolean
                description: true when an embedding exists in the face engine store
        jetson_available:
          type: boolean
          description: whether the local face engine is wired up

    WorkerEnrollResult:
      type: object
      properties:
        ok: { type: boolean }
        person_id: { type: string }
        full_name: { type: string }
        error: { type: string, description: present only when ok is false }

    PlateRecord:
      type: object
      properties:
        rec_no: { type: integer }
        plate_number: { type: string }
        list_type: { type: string }
        master_of_car: { type: string, nullable: true }
        plate_color: { type: string, nullable: true }
        vehicle_color: { type: string, nullable: true }

    PlateAdd:
      type: object
      required: [plate_number]
      properties:
        plate_number: { type: string }
        list_type:
          type: string
          enum: [TrafficRedList, TrafficBlackList]
          default: TrafficRedList
        master_of_car: { type: string }
        plate_color: { type: string }
        vehicle_color: { type: string }
        open_gate: { type: boolean, default: false }
        cameras:
          type: array
          items: { type: integer }
          description: Defaults to every active camera.

    CaptureFile:
      type: object
      properties:
        filename:
          type: string
          description: Path relative to storage_path, e.g. face_captures/0.jpg — pass to /api/incidents/{id}/files/{filename}.
        bytes: { type: integer }

    IncidentDetail:
      type: object
      properties:
        incident_id: { type: string }
        storage_path:
          type: string
          description: Absolute path of the signed evidence package on the Jetson NVMe.
        metadata:
          type: object
          additionalProperties: true
          nullable: true
          description: incident_metadata.json — classification, GPS, dispatch log, etc.
        manifest:
          type: object
          additionalProperties: true
          nullable: true
          description: manifest.json — the signed list of files with per-file SHA-256.
        signature:
          type: object
          additionalProperties: true
          nullable: true
          description: signature.sha256 — manifest_hash + HMAC signature.
        files:
          type: array
          items: { type: string }
          description: Every file in the package, relative to storage_path.
        face_captures: { type: array, items: { $ref: "#/components/schemas/CaptureFile" } }
        plate_captures: { type: array, items: { $ref: "#/components/schemas/CaptureFile" } }
        sensor_captures: { type: array, items: { $ref: "#/components/schemas/CaptureFile" } }
        video_files:
          type: array
          items: { type: string }
          description: Evidence clip filenames (manifest kind video_*).
        has_pdf: { type: boolean }
        has_highlight: { type: boolean }
        manifest_kinds:
          type: array
          items: { type: string }

    IncidentSummary:
      type: object
      properties:
        incident_id: { type: string }
        storage_path:
          type: string
          description: Absolute path of the evidence package on the Jetson NVMe.
        site_id: { type: string, nullable: true }
        operator_id: { type: string, nullable: true }
        device_id: { type: string, nullable: true }
        started_utc: { type: string, nullable: true }
        finalized: { type: boolean }
        signature: { type: string, nullable: true }
        manifest_hash: { type: string, nullable: true }

    RawEvent:
      type: object
      properties:
        seq: { type: integer }
        camera_id: { type: integer }
        code: { type: string }
        action: { type: string, enum: [Start, Stop, Pulse] }
        index: { type: integer }
        data: { type: object, additionalProperties: true }
        has_jpeg: { type: boolean }
        ts: { type: number }

    B1Payload:
      type: object
      required: [action, person_id]
      properties:
        action: { type: string, enum: [add, update, deactivate] }
        person_id: { type: string }
        full_name: { type: string }
        image_b64:
          type: string
          description: |
            Base64-encoded JPEG. Required for `add` / `update`. The Jetson
            computes an InsightFace embedding from the bytes and stores it
            keyed by `person_id`.

    B1Result:
      type: object
      properties:
        synced: { type: boolean }
        person_id: { type: string }
        reason: { type: string, description: present only when synced is false }

    B3Payload:
      type: object
      required: [action, window_id, person_id]
      properties:
        action: { type: string, enum: [arm, disarm] }
        window_id: { type: string }
        person_id: { type: string }
        start_utc: { type: string }
        end_utc:   { type: string }

    B4Payload:
      type: object
      required: [command_type, parameters]
      properties:
        command_type:
          type: string
          enum: [ptz_override, deterrence_fire, deterrence_standdown, request_stream]
        parameters:
          type: object
          properties:
            camera_id: { type: integer }
            preset_id: { type: integer }
            pan: { type: number }
            tilt: { type: number }
            zoom: { type: number }
            light: { type: boolean }
            speaker: { type: boolean }
            bbox:
              type: array
              minItems: 4
              maxItems: 4
              items: { type: number }
            frame_width: { type: integer }
            frame_height: { type: integer }

    # ─── Capabilities / Health ──────────────────────────────────────

    HealthProbeReport:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        cached: { type: boolean }
        cameras:
          type: array
          items:
            type: object
            properties:
              camera_id: { type: integer }
              endpoint: { type: string }
              model: { type: string, nullable: true }
              green_count: { type: integer }
              red_count: { type: integer }
              checks:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string,
                            description: "reachable, snapshot, face_recognition_db, anpr_redlist, ptz, deterrence, …" }
                    label: { type: string }
                    status: { type: string,
                              enum: [ok, missing, error, unknown, "n/a"] }
                    category: { type: string,
                                enum: [core, media, ai, control, events] }
                    detail: { type: string, nullable: true }
                    backup_hint: { type: string, nullable: true,
                                   description: "what to do if this is missing/error" }
              backup_recommendations:
                type: array
                items:
                  type: object
                  properties:
                    check: { type: string }
                    label: { type: string }
                    hint: { type: string }

    CapabilitySummary:
      type: object
      properties:
        available: { type: boolean }
        face_engine_ready: { type: boolean }
        plate_engine_ready: { type: boolean }
        behavior_engine_ready: { type: boolean }
        cameras:
          type: object
          description: |
            Keyed by camera_id (stringified). Each value's flags are
            effective decisions — operator overrides already applied.
          additionalProperties:
            type: object
            properties:
              face_recognition: { type: boolean }
              anpr:             { type: boolean }
              ivs_rules:        { type: boolean }
              deterrence:       { type: boolean }
              snapshot:         { type: boolean }
              local_storage:    { type: boolean }
        overrides:
          type: object
          description: |
            `{cam_id_str: {cap_name: true_if_forced_fallback}}`. Missing
            keys = follow the probe; only set keys override.
          additionalProperties:
            type: object
            additionalProperties: { type: boolean }

    PresetInfo:
      type: object
      properties:
        index: { type: integer }
        name: { type: string }
        pan:  { type: number, nullable: true }
        tilt: { type: number, nullable: true }
        zoom: { type: number, nullable: true }

    # ─── Zones ──────────────────────────────────────────────────────

    Zone:
      type: object
      required: [zone_id, zone_type, points]
      properties:
        zone_id: { type: string, description: "operator-chosen, unique per camera" }
        zone_type:
          type: string
          enum: [region, line]
          description: |
            * `region` — closed polygon (≥3 pts). Drives intrusion + loitering.
            * `line`   — open polyline (≥2 pts). Drives line_crossing.
        points:
          type: array
          description: |
            Sequence of `[nx, ny]` pairs, normalised `[0,1]` in image
            space. Engine resolves to pixels at evaluation time so
            zones survive snapshot resolution changes.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        name: { type: string }
        direction:
          type: string
          enum: [Any, LeftToRight, RightToLeft]
          default: Any
          description: "Only meaningful for line zones."
        metadata: { type: object, additionalProperties: true }

    # ─── Sensors ────────────────────────────────────────────────────

    SensorMapping:
      type: object
      required: [zone_id, camera_id, preset_name]
      properties:
        zone_id: { type: integer, description: "from the AX PRO hub" }
        camera_id: { type: integer }
        preset_name:
          type: string
          description: "must match an existing preset on the camera (see /api/cameras/{id}/presets)"
        sensor_type:
          type: string
          description: "PIR | doorContact | vibration | pircam | smoke (advisory)"
        description: { type: string }
        metadata: { type: object, additionalProperties: true }

    SensorEvent:
      type: object
      properties:
        zone_id: { type: integer }
        event_type: { type: string }
        event_state: { type: string, default: alarm }
        zone_name: { type: string }
        source: { type: string, enum: [axpro, simulate] }
        received_ts: { type: number, description: "unix epoch seconds" }
        raw: { type: object, additionalProperties: true }

    SensorEventRecord:
      allOf:
        - $ref: "#/components/schemas/SensorEvent"
        - type: object
          properties:
            seq: { type: integer, description: "monotonic per-process counter" }
            outcome:
              type: object
              description: |
                Dispatcher's verdict for this event. `verdict` is the
                primary key; other keys depend on which branch fired.
              properties:
                verdict:
                  type: string
                  enum:
                    - authorised
                    - intruder
                    - unverified_no_face
                    - unverified_no_engine
                    - engine_error
                    - cooldown
                    - unmapped
                    - no_camera
                    - pan_failed
                    - snapshot_failed
                camera_id:    { type: integer, nullable: true }
                preset_name:  { type: string,  nullable: true }
                person_id:    { type: string,  nullable: true }
                full_name:    { type: string,  nullable: true }
                similarity:   { type: number,  nullable: true }
                remaining_s:  { type: number,  nullable: true }

    ListenerStatus:
      type: object
      properties:
        wired:
          type: boolean
          description: "false if ITIPS_AXPRO_HOST is unset (listener disabled)."
        reason: { type: string, description: "Set only when wired=false." }
        host:        { type: string }
        connected:   { type: boolean }
        armed:       { type: boolean, description: "cached subsystem_status() reading" }
        last_error:  { type: string, nullable: true }
        thread_alive: { type: boolean }

    # ─── ML Lab ─────────────────────────────────────────────────────

    MLEngineStatus:
      type: object
      properties:
        wired: { type: boolean }
        ready: { type: boolean,
                 description: "true once the engine's warmup_async has finished" }

    FaceRecognizeResult:
      type: object
      properties:
        ok: { type: boolean }
        engine_ready: { type: boolean }
        matched: { type: boolean }
        person_id: { type: string, nullable: true }
        full_name: { type: string, nullable: true }
        similarity: { type: number, description: "cosine in [-1, 1]" }
        dispatched:
          type: boolean
          description: "true if ?dispatch=1 and we fired through the AlertEngine"

    PlateReadResult:
      type: object
      properties:
        ok: { type: boolean }
        engine_ready: { type: boolean }
        found: { type: boolean }
        plate_number: { type: string, nullable: true,
                         description: "uppercase, separators stripped" }
        confidence: { type: number, nullable: true, description: "[0,1]" }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
          nullable: true
        raw_text: { type: string, nullable: true,
                     description: "OCR output before the plate-pattern filter" }
        dispatched: { type: boolean }

    BehaviorAlert:
      type: object
      properties:
        alert_type:
          type: string
          enum: [intrusion, loitering, line_crossing]
        zone_id: { type: string }
        zone_name: { type: string }
        track_id: { type: integer }
        class_name: { type: string,
                       description: "person | car | bicycle | motorcycle | bus | truck" }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        details: { type: object, additionalProperties: true }

    DetectionRecord:
      type: object
      properties:
        class_name: { type: string }
        confidence: { type: number }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        anchor_px:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "bottom-center of bbox in pixels — what the region check uses"
        anchor_norm:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "same as anchor_px but normalised to [0,1]"

    BehaviorAnalysisResult:
      type: object
      properties:
        ok: { type: boolean }
        engine_ready: { type: boolean }
        camera_id: { type: integer }
        frame_size:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: integer }
          description: "[width, height] in pixels"
        zone_count: { type: integer }
        zones:
          type: array
          items: { $ref: "#/components/schemas/Zone" }
        detections:
          type: array
          items: { $ref: "#/components/schemas/DetectionRecord" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/BehaviorAlert" }
        dispatched: { type: integer,
                       description: "count of alerts routed to AlertEngine" }

    WebhookSubscriber:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        event_filter: { type: array, items: { type: string } }
        description: { type: string }
        enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        last_status: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
        last_delivered_at: { type: string, nullable: true }
        consecutive_failures: { type: integer }
